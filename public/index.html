<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>同棲物件・不動産会社評価ダッシュボード (Cohabitation Housing Tracker)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .tab-active { border-bottom: 3px solid #2563eb; color: #1d4ed8; font-weight: 800; background: #eff6ff; }
    .subtab-active { background: #1e293b; color: #ffffff; font-weight: 800; }
    .rank-S { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; border: 1px solid #f59e0b; }
    .rank-A { background: #dcfce7; color: #166534; border: 1px solid #22c55e; }
    .rank-B { background: #e0f2fe; color: #075985; border: 1px solid #38bdf8; }
    .rank-C { background: #f3f4f6; color: #374151; border: 1px solid #9ca3af; }
    .rank-NG { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
    .rank-PENDING { background: #f8fafc; color: #475569; border: 1px dashed #cbd5e1; }
    /* Thin clean scrollbars where needed */
    ::-webkit-scrollbar { width: 5px; height: 5px; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 9999px; }
  </style>
</head>
<body class="bg-slate-100 text-slate-900 h-screen overflow-hidden flex flex-col">
  <!-- Compact Top Header (44px) -->
  <header class="bg-white border-b border-slate-200 shrink-0 shadow-sm">
    <div class="max-w-[1800px] mx-auto px-3 sm:px-5 h-11 flex items-center justify-between gap-2">
      <div class="flex items-center gap-2 shrink-0">
        <div class="w-7 h-7 rounded-lg bg-blue-600 text-white flex items-center justify-center font-bold text-sm">🏠</div>
        <h1 class="text-sm font-extrabold text-slate-900 hidden sm:block">同棲物件・不動産会社評価ダッシュボード</h1>
      </div>

      <!-- Main Navigation Tabs -->
      <div class="flex items-center h-full overflow-x-auto">
        <button id="tab-btn-properties" onclick="switchTab('properties')" class="tab-active px-3.5 h-full text-xs whitespace-nowrap transition flex items-center gap-1.5">
          <span>🏠 1. 物件・マイソク比較</span>
          <span id="badge-prop-count" class="px-1.5 py-0.2 text-[10px] rounded-full bg-blue-600 text-white">0</span>
        </button>
        <button id="tab-btn-agencies" onclick="switchTab('agencies')" class="px-3.5 h-full text-xs text-slate-600 hover:text-slate-900 whitespace-nowrap transition flex items-center gap-1.5">
          <span>🏢 2. 不動産会社・担当者評価</span>
          <span id="badge-agency-count" class="px-1.5 py-0.2 text-[10px] rounded-full bg-slate-200 text-slate-700">0</span>
        </button>
        <button id="tab-btn-proposals" onclick="switchTab('proposals')" class="px-3.5 h-full text-xs text-slate-600 hover:text-slate-900 whitespace-nowrap transition flex items-center gap-1.5">
          <span>💰 3. 初期費用・相見積もり</span>
          <span id="badge-proposal-count" class="px-1.5 py-0.2 text-[10px] rounded-full bg-slate-200 text-slate-700">0</span>
        </button>
        <button id="tab-btn-viewing" onclick="switchTab('viewing')" class="px-3.5 h-full text-xs text-slate-600 hover:text-slate-900 whitespace-nowrap transition flex items-center gap-1.5">
          <span>📏 4. 内見・採寸シート</span>
        </button>
      </div>

      <div class="flex items-center gap-2 text-[11px] shrink-0">
        <span id="sync-badge" class="px-2 py-0.5 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 font-medium hidden md:inline">
          ● PKB同期中
        </span>
        <button onclick="reloadData()" class="px-2.5 py-1 rounded-md bg-slate-800 hover:bg-slate-700 text-white font-medium transition">
          🔄 更新
        </button>
      </div>
    </div>
  </header>

  <!-- Main Viewport Container (Fits 100% of remaining MacBook height) -->
  <main class="flex-1 min-h-0 max-w-[1800px] w-full mx-auto px-3 sm:px-5 py-2.5 flex flex-col">

    <!-- TAB 1: FIT-TO-SCREEN SIDE-BY-SIDE MAISOKU + TABBED RIGHT PANEL -->
    <section id="tab-properties" class="flex-1 min-h-0 flex flex-col gap-2">
      <!-- Single-Row Filter + Property Selector Pills -->
      <div class="bg-white px-3 py-1.5 rounded-xl border border-slate-200 shadow-sm shrink-0 flex items-center justify-between gap-2 overflow-x-auto">
        <!-- Property Pills -->
        <div id="property-strip" class="flex items-center gap-1.5 overflow-x-auto py-0.5"></div>

        <!-- Compact Filter & Sort on Right -->
        <div class="flex items-center gap-1.5 shrink-0 border-l border-slate-200 pl-2 text-[11px]">
          <select id="prop-filter-select" onchange="setPropFilter(this.value)" class="border border-slate-300 rounded-md px-2 py-1 bg-slate-50 font-bold text-slate-700">
            <option value="ALL">表示: すべて (7件)</option>
            <option value="PASS">⭕ 必須条件クリアのみ</option>
            <option value="PDF">🖼️ マイソク・見積あり</option>
            <option value="RELAXED">⚠️ 緩和・要確認枠</option>
            <option value="FAIL">❌ 条件NG物件</option>
          </select>
          <select id="prop-sort" onchange="renderProperties()" class="border border-slate-300 rounded-md px-2 py-1 bg-slate-50 font-medium text-slate-700">
            <option value="score_desc">順: AIスコア</option>
            <option value="rent_asc">順: 家賃が安い</option>
            <option value="initial_asc">順: 初期費用が安い</option>
            <option value="area_desc">順: 面積が広い</option>
          </select>
        </div>
      </div>

      <!-- Fit-to-Screen Workspace Card -->
      <div id="property-workspace" class="flex-1 min-h-0 bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden flex flex-col"></div>
    </section>

    <!-- TAB 2: REAL ESTATE AGENCIES EVALUATION (Scrollable Tab) -->
    <section id="tab-agencies" class="hidden flex-1 min-h-0 overflow-y-auto space-y-3 pr-1">
      <div id="kpi-row" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-2.5"></div>
      <div class="bg-white p-3 rounded-xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-2">
        <div class="flex flex-wrap items-center gap-1.5">
          <button onclick="setAgencyFilter('ALL')" data-af="ALL" class="agency-filter-btn px-3 py-1 rounded-lg text-xs font-bold bg-blue-600 text-white">すべて表示</button>
          <button onclick="setAgencyFilter('WAVE1')" data-af="WAVE1" class="agency-filter-btn px-3 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-700">🔥 第1弾（送信済20社）</button>
          <button onclick="setAgencyFilter('REPLIED')" data-af="REPLIED" class="agency-filter-btn px-3 py-1 rounded-lg text-xs font-medium bg-emerald-50 text-emerald-800 border border-emerald-200">✉️ 返信・動きあり（S/A/B）</button>
          <button onclick="setAgencyFilter('TOKYO')" data-af="TOKYO" class="agency-filter-btn px-3 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-700">🗼 都内版（木場〜上野圏）</button>
          <button onclick="setAgencyFilter('KANAGAWA')" data-af="KANAGAWA" class="agency-filter-btn px-3 py-1 rounded-lg text-xs font-medium bg-slate-100 text-slate-700">🌉 神奈川版（溝の口）</button>
        </div>
        <div class="text-[11px] text-slate-500">
          ※変更すると即座にPKB (`housing_db.json` & `housing.db`) に自動保存されます
        </div>
      </div>
      <div id="agency-list" class="grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 gap-3 pb-4"></div>
    </section>

    <!-- TAB 3: INITIAL COST & PROPOSAL AUDIT (Scrollable Tab) -->
    <section id="tab-proposals" class="hidden flex-1 min-h-0 overflow-y-auto space-y-3 pr-1 pb-4">
      <div id="proposals-container"></div>
    </section>

    <!-- TAB 4: VIEWING & MEASUREMENT CHECKSHEET (Scrollable Tab) -->
    <section id="tab-viewing" class="hidden flex-1 min-h-0 overflow-y-auto space-y-3 pr-1 pb-4">
      <div id="viewing-container"></div>
    </section>
  </main>

  <!-- Full-Screen Image Zoom Modal (Lightbox) -->
  <div id="image-modal" onclick="closeImageModal()" class="fixed inset-0 bg-black/85 z-50 hidden items-center justify-center p-3 cursor-zoom-out">
    <div class="relative max-w-[96vw] max-h-[96vh] flex flex-col items-center">
      <div class="text-white text-xs mb-1.5 bg-slate-900/90 px-4 py-1 rounded-full">クリックまたはESCキーで閉じる</div>
      <img id="image-modal-src" src="" alt="拡大画像" class="max-w-[95vw] max-h-[90vh] object-contain rounded-lg shadow-2xl bg-white" />
    </div>
  </div>

  <script src="/app.js"></script>
</body>
</html>
