<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>同棲物件・不動産会社評価ダッシュボード (Cohabitation Housing Tracker)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", sans-serif; }
    .tab-active { border-bottom: 3px solid #2563eb; color: #1d4ed8; font-weight: 700; background: #eff6ff; }
    .rank-S { background: linear-gradient(135deg, #fef3c7, #fde68a); color: #92400e; border: 1px solid #f59e0b; }
    .rank-A { background: #dcfce7; color: #166534; border: 1px solid #22c55e; }
    .rank-B { background: #e0f2fe; color: #075985; border: 1px solid #38bdf8; }
    .rank-C { background: #f3f4f6; color: #374151; border: 1px solid #9ca3af; }
    .rank-NG { background: #fee2e2; color: #991b1b; border: 1px solid #ef4444; }
    .rank-PENDING { background: #f8fafc; color: #475569; border: 1px dashed #cbd5e1; }
  </style>
</head>
<body class="bg-slate-50 text-slate-900 min-h-screen">
  <!-- Header -->
  <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 py-3 flex flex-wrap items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <div class="w-10 h-10 rounded-xl bg-blue-600 text-white flex items-center justify-center font-bold text-xl shadow">🏠</div>
        <div>
          <h1 class="text-lg sm:text-xl font-bold text-slate-900">同棲物件・不動産会社評価ダッシュボード</h1>
          <p class="text-xs text-slate-500">PKB連携 (03.13 / 03.14 / 04.34) ・ 2027年1月〜2月上旬入居 ・ 上限17万円 / 初期費用80万円以内 / 50㎡以上 RC・SRC造</p>
        </div>
      </div>
      <div class="flex items-center gap-2 text-xs">
        <span id="sync-badge" class="px-2.5 py-1 rounded-full bg-emerald-50 text-emerald-700 border border-emerald-200 font-medium">
          ● PKB JSON & SQLite 双方向同期中
        </span>
        <button onclick="reloadData()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 text-white font-medium transition">
          🔄 最新データ再読込
        </button>
      </div>
    </div>

    <!-- Navigation Tabs -->
    <div class="max-w-[1600px] mx-auto px-4 sm:px-6 flex overflow-x-auto border-t border-slate-100">
      <button id="tab-btn-properties" onclick="switchTab('properties')" class="tab-active px-5 py-3 text-sm whitespace-nowrap transition flex items-center gap-2">
        <span>🏠 1. 物件・マイソク・AI診断ボード</span>
        <span id="badge-prop-count" class="px-2 py-0.5 text-xs rounded-full bg-blue-600 text-white">0</span>
      </button>
      <button id="tab-btn-agencies" onclick="switchTab('agencies')" class="px-5 py-3 text-sm text-slate-600 hover:text-slate-900 whitespace-nowrap transition flex items-center gap-2">
        <span>🏢 2. 不動産会社・担当者 評価ランキング</span>
        <span id="badge-agency-count" class="px-2 py-0.5 text-xs rounded-full bg-slate-200 text-slate-700">0</span>
      </button>
      <button id="tab-btn-proposals" onclick="switchTab('proposals')" class="px-5 py-3 text-sm text-slate-600 hover:text-slate-900 whitespace-nowrap transition flex items-center gap-2">
        <span>💰 3. 初期費用・相見積もりボッタクリ診断</span>
        <span id="badge-proposal-count" class="px-2 py-0.5 text-xs rounded-full bg-slate-200 text-slate-700">0</span>
      </button>
      <button id="tab-btn-viewing" onclick="switchTab('viewing')" class="px-5 py-3 text-sm text-slate-600 hover:text-slate-900 whitespace-nowrap transition flex items-center gap-2">
        <span>📏 4. 内見・現地採寸チェックシート</span>
      </button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="max-w-[1600px] mx-auto px-4 sm:px-6 py-5">
    <!-- KPI Summary Row -->
    <section id="kpi-row" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-3 mb-5"></section>

    <!-- TAB 1: PROPERTIES & MAISOKU INSPECTOR -->
    <section id="tab-properties" class="space-y-4">
      <!-- Filter & Sort Bar -->
      <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-1.5" id="prop-filters">
          <button onclick="setPropFilter('ALL')" data-filter="ALL" class="prop-filter-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white">すべて</button>
          <button onclick="setPropFilter('PASS')" data-filter="PASS" class="prop-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-50 text-emerald-800 border border-emerald-200">⭕ 必須条件完全クリア</button>
          <button onclick="setPropFilter('PDF')" data-filter="PDF" class="prop-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-amber-50 text-amber-800 border border-amber-200">📄 マイソク・見積PDF有</button>
          <button onclick="setPropFilter('RELAXED')" data-filter="RELAXED" class="prop-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-sky-50 text-sky-800 border border-sky-200">⚠️ 緩和枠・要確認</button>
          <button onclick="setPropFilter('FAIL')" data-filter="FAIL" class="prop-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-rose-50 text-rose-800 border border-rose-200">❌ 条件外（NG理由確認）</button>
        </div>
        <div class="flex items-center gap-2 text-xs">
          <label class="text-slate-500 font-medium">並び替え:</label>
          <select id="prop-sort" onchange="renderProperties()" class="border border-slate-300 rounded-lg px-2.5 py-1.5 bg-white font-medium">
            <option value="score_desc">AI診断スコア順（高→低）</option>
            <option value="rent_asc">月額総家賃（安→高）</option>
            <option value="initial_asc">初期費用総額（安→高）</option>
            <option value="area_desc">専有面積（広→狭）</option>
          </select>
        </div>
      </div>

      <!-- Master-Detail Layout: Left Cards, Right Split Inspector -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-5 items-start">
        <div id="property-list" class="lg:col-span-5 space-y-3"></div>
        <div id="property-inspector" class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 shadow-sm sticky top-32 overflow-hidden"></div>
      </div>
    </section>

    <!-- TAB 2: REAL ESTATE AGENCIES EVALUATION -->
    <section id="tab-agencies" class="hidden space-y-4">
      <div class="bg-white p-4 rounded-xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
        <div class="flex flex-wrap items-center gap-1.5">
          <button onclick="setAgencyFilter('ALL')" data-af="ALL" class="agency-filter-btn px-3 py-1.5 rounded-lg text-xs font-bold bg-blue-600 text-white">すべて表示</button>
          <button onclick="setAgencyFilter('WAVE1')" data-af="WAVE1" class="agency-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-700">🔥 第1弾（送信済20社）</button>
          <button onclick="setAgencyFilter('REPLIED')" data-af="REPLIED" class="agency-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-emerald-50 text-emerald-800 border border-emerald-200">✉️ 返信・動きあり（S/A/B）</button>
          <button onclick="setAgencyFilter('TOKYO')" data-af="TOKYO" class="agency-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-700">🗼 都内版（木場〜上野圏）</button>
          <button onclick="setAgencyFilter('KANAGAWA')" data-af="KANAGAWA" class="agency-filter-btn px-3 py-1.5 rounded-lg text-xs font-medium bg-slate-100 text-slate-700">🌉 神奈川版（溝の口）</button>
        </div>
        <div class="text-xs text-slate-500">
          ※ランク（S/A/B/C/NG）や5軸評価・メモを変更すると即座にPKB (`housing_db.json` & `housing.db`) に自動保存されます
        </div>
      </div>
      <div id="agency-list" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
    </section>

    <!-- TAB 3: INITIAL COST & PROPOSAL AUDIT -->
    <section id="tab-proposals" class="hidden space-y-4">
      <div id="proposals-container"></div>
    </section>

    <!-- TAB 4: VIEWING & MEASUREMENT CHECKSHEET -->
    <section id="tab-viewing" class="hidden space-y-4">
      <div id="viewing-container"></div>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
